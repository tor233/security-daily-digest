<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日安全漏洞文章聚合</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --dim:#8b949e; --accent:#58a6ff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--fg); font:15px/1.7 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:16px 24px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; }
  header .meta { color:var(--dim); font-size:13px; }
  #search { margin-left:auto; background:var(--panel); border:1px solid var(--border); color:var(--fg);
            padding:6px 12px; border-radius:6px; width:260px; outline:none; }
  #search:focus { border-color:var(--accent); }
  main { display:flex; min-height:calc(100vh - 61px); }
  nav { width:220px; flex-shrink:0; border-right:1px solid var(--border); padding:12px 0; overflow-y:auto; }
  nav .day { display:flex; justify-content:space-between; padding:8px 20px; cursor:pointer; color:var(--dim); font-size:14px; }
  nav .day:hover { background:var(--panel); color:var(--fg); }
  nav .day.active { background:var(--panel); color:var(--accent); border-right:2px solid var(--accent); }
  nav .count { font-size:12px; background:var(--panel); border-radius:10px; padding:0 8px; }
  article { flex:1; padding:24px 32px; max-width:960px; overflow-y:auto; }
  article h1,article h2,article h3 { margin:18px 0 10px; border-bottom:1px solid var(--border); padding-bottom:6px; }
  article h1 { font-size:20px; } article h2 { font-size:17px; } article h3 { font-size:15px; }
  article a { color:var(--accent); text-decoration:none; } article a:hover { text-decoration:underline; }
  article li { margin:4px 0; }
  article blockquote { border-left:3px solid var(--border); padding-left:12px; color:var(--dim); }
  article code { background:var(--panel); padding:1px 6px; border-radius:4px; font-size:13px; }
  .empty { color:var(--dim); padding:60px 0; text-align:center; }
  mark { background:#9e6a03; color:#fff; border-radius:2px; padding:0 2px; }
</style>
</head>
<body>
<header>
  <h1>🛡️ 每日安全漏洞文章聚合</h1>
  <span class="meta" id="meta">加载中…</span>
  <input id="search" type="search" placeholder="搜索标题 / 关键词（如 RCE、未授权）">
</header>
<main>
  <nav id="days"></nav>
  <article id="content" class="empty">正在加载…</article>
</main>
<script>
const $days = document.getElementById('days');
const $content = document.getElementById('content');
const $meta = document.getElementById('meta');
const $search = document.getElementById('search');
let days = [], current = null, rawMd = '';

async function boot() {
  try {
    const idx = await (await fetch('archive/index.json?_=' + Date.now())).json();
    days = (idx.days || []).slice().sort((a,b) => b.date.localeCompare(a.date));
  } catch { days = []; }
  if (!days.length) {
    $meta.textContent = '';
    $content.innerHTML = '<div class="empty">暂无数据<br><small>等待 Automation 首次运行后自动提交</small></div>';
    return;
  }
  $meta.textContent = '共 ' + days.length + ' 天 · 最近更新 ' + days[0].date;
  renderDays();
  load(days[0].date);
}

function renderDays() {
  $days.innerHTML = '';
  for (const d of days) {
    const el = document.createElement('div');
    el.className = 'day' + (d.date === current ? ' active' : '');
    el.innerHTML = '<span>' + d.date + '</span><span class="count">' + (d.total ?? '') + '</span>';
    el.onclick = () => load(d.date);
    $days.appendChild(el);
  }
}

async function load(date) {
  current = date; renderDays();
  $content.innerHTML = '<div class="empty">加载中…</div>';
  try {
    rawMd = await (await fetch('archive/' + date + '.md?_=' + Date.now())).text();
    render();
  } catch {
    $content.innerHTML = '<div class="empty">该日期的清单文件不存在</div>';
  }
}

function render() {
  const q = $search.value.trim();
  let md = rawMd;
  if (q) {
    const terms = q.toLowerCase().split(/\s+/);
    md = rawMd.split('\n').map(line => {
      if (!/^\s*[-*]\s+/.test(line)) return line;
      const low = line.toLowerCase();
      return terms.every(t => low.includes(t)) ? line : '';
    }).filter((l,i,arr) => l !== '' || (arr[i-1] && arr[i-1] !== '')).join('\n');
  }
  let html = DOMPurify.sanitize(marked.parse(md));
  if (q) html = html.replace(new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').split(/\s+/).join('|') + ')','gi'), '<mark>$1</mark>');
  $content.className = '';
  $content.innerHTML = html;
}

$search.addEventListener('input', () => { if (current) render(); });
boot();
</script>
</body>
</html>
